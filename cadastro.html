<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro | Nossa Casa, Nosso Lar</title>
<meta name="description" content="Cadastre-se como voluntario ou apoiador.">
<link rel="stylesheet" href="styles.css">
<script src="script.js"></script>
</head>
<body>
<header>
<nav aria-label="Principal">
     <ul>
        <li class="marca">Nossa Casa, Nosso Lar</li>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
     </ul>
</nav>
</header>
    <main id="conteudo">
         <h1>Cadastro de voluntarios e apoiadores</h1>
     <form action="#" method="post">
  <fieldset>
       <legend>Dados pessoais</legend>
           <div class="campos">
           <div class="larga"><label for="nome">Nome completo</label>
               <input id="nome" name="nome" type="text" autocomplete="name" required minlength="5" placeholder=" "></div>
          <div><label for="email">E-mail</label>
               <input id="email" name="email" type="email" autocomplete="email" required placeholder=" "></div>
          <div><label for="telefone">Telefone</label>
              <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="numeric" required pattern="\(\d{2}\) \d{5}-\d{4}" maxlength="15" placeholder="(11) 91234-5678"></div>
          <div><label for="cpf">CPF</label>
               <input id="cpf" name="cpf" type="text" inputmode="numeric" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" placeholder="000.000.000-00"></div>
         <div><label for="nascimento">Data de nascimento</label>
               <input id="nascimento" name="nascimento" type="date" required max="2008-12-31"></div>
        </div>
 </fieldset>
<fieldset>
<legend>Endereco</legend>
<div class="campos">
<div><label for="cep">CEP</label>
     <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" required pattern="\d{5}-\d{3}" maxlength="9" placeholder="00000-000"></div>
<div class="larga"><label for="endereco">Endereco</label>
     <input id="endereco" name="endereco" type="text" autocomplete="street-address" required></div>
<div><label for="cidade">Cidade</label>
     <input id="cidade" name="cidade" type="text" autocomplete="address-level2" required></div>
<div><label for="estado">Estado</label>
<select id="estado" name="estado" required>
<option value="">Selecione</option>
<option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
</select></div>
</div>
</fieldset>
<button type="submit">Enviar cadastro</button>
</form>
<script src="js/mascaras.js"></script>
</main>
</body></html>
